[tools]
bun = "1.3.14"

[tasks.install]
description = "Install the locked JavaScript dependencies"
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Start the API server and Vite development server"
run = "bun run dev"

[tasks.start]
description = "Build and start the production dashboard"
depends = ["install"]
run = "bun run start"

[tasks.check]
description = "Type-check the application and tests"
run = "bun run check"

[tasks.analyze-cache]
description = "Infer the Kimi prompt-cache inactivity window from local wire logs"
run = "bun run analyze-cache"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.build]
description = "Build the production dashboard"
run = "bun run build"

[tasks.verify]
description = "Run type-checks, tests, and the production build"
run = "bun run verify"
